<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
</head>

<body>

    <h1>Django URL Shortener</h1>

    <form method="POST" action="{% url 'shorten_url' %}">
        {% csrf_token %}

        <input type="url" name="original_url" placeholder="Enter your long URL" required>

        <button type="submit">Shorten URL</button>
    </form>

    {% if short_url %}
        <h2>Your Short URL:</h2>

        <a href="{{ short_url }}" target="_blank">
            {{ short_url }}
        </a>
    {% endif %}

</body>
</html>
